<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="ブックカフェサファリで遊べる謎解きゲームのご案内です。" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://invite.escape-safari.com/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>謎解きのご案内｜ブックカフェサファリ</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", Meiryo,
          sans-serif;
        background: #f4efe4;
        color: #302a22;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
      }
      main {
        width: min(100% - 40px, 760px);
        margin: 0 auto;
        padding: clamp(56px, 12vw, 112px) 0;
      }
      .eyebrow {
        margin: 0 0 12px;
        color: #8a5d35;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
      }
      h1 {
        margin: 0;
        font-family: Georgia, "Hiragino Mincho ProN", "Yu Mincho", serif;
        font-size: clamp(2rem, 8vw, 3.8rem);
        font-weight: 500;
        line-height: 1.2;
      }
      .intro {
        max-width: 36rem;
        margin: 20px 0 40px;
        color: #655c51;
        line-height: 1.9;
      }
      .card {
        display: block;
        padding: clamp(24px, 6vw, 40px);
        border: 1px solid #d8c8ad;
        border-radius: 12px;
        background: #fffdf8;
        color: inherit;
        text-decoration: none;
        transition:
          border-color 0.18s ease,
          transform 0.18s ease;
      }
      .card:hover,
      .card:focus-visible {
        border-color: #9c6335;
        transform: translateY(-2px);
      }
      .card:focus-visible {
        outline: 3px solid #9c6335;
        outline-offset: 4px;
      }
      .card h2 {
        margin: 0;
        font-family: Georgia, "Hiragino Mincho ProN", "Yu Mincho", serif;
        font-size: clamp(1.35rem, 5vw, 2rem);
        font-weight: 500;
      }
      .card p {
        margin: 12px 0 0;
        color: #655c51;
        line-height: 1.8;
      }
      .arrow {
        display: inline-block;
        margin-top: 22px;
        color: #8a4f26;
        font-weight: 700;
      }
      footer {
        margin-top: 40px;
        color: #82786c;
        font-size: 0.8rem;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">BOOKCAFE SAFARI</p>
      <h1>物語に入り込む<br />謎解き体験</h1>
      <p class="intro">ブックカフェサファリで遊べる謎解きゲームをご案内します。</p>
      <a class="card" href="/bookcafe/">
        <h2>ブックカフェからの脱出</h2>
        <p>本棚や手記に隠された手がかりをたどる、実店舗探索型のルーム謎です。</p>
        <span class="arrow">詳しく見る →</span>
      </a>
      <footer>ブックカフェサファリ</footer>
    </main>
  </body>
</html>
